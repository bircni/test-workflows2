name: Reusable Build

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment
        type: string
        required: true
      runs-on:
        description: Runner to use
        type: string
        default: ubuntu-latest
    outputs:
      artifact-name:
        description: Name of the produced artifact
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      artifact-name: ${{ steps.set-output.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: echo "Building for environment: ${{ inputs.environment }}"
      - name: Set output
        id: set-output
        run: echo "artifact-name=build-${{ inputs.environment }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
